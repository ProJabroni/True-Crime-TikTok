name: Daily true crime video

on:
  push:                     # edit test-run.txt = test video (Buffer draft only); edit post-now.txt = real video now
    branches: [main]
    paths: [test-run.txt, post-now.txt]
  schedule:                 # Make the video in the afternoon so it's ready for Buffer's 7pm post.
    - cron: "7 19 * * *"    # 3:07pm New York (2:07pm in winter)
    - cron: "13 20 * * *"   # backup: 4:13pm New York, only if GitHub's timer skipped or the run failed
    - cron: "17 21 * * *"   # backup: 5:17pm New York, same
                            # A backup does nothing if today's video is already in Buffer.
  workflow_dispatch:
    inputs:
      post:
        description: "Post to TikTok through Buffer (turn off to just make a test video)"
        type: boolean
        default: true

permissions:
  contents: write
  pages: read

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if tonight's video is already in Buffer
        id: guard
        run: |
          TODAY=$(date -u +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && \
             jq -e --arg d "$TODAY" 'map(select(.date == $d and (.status | test("queued|made, not posted")))) | length > 0' state/history.json > /dev/null; then
            echo "Tonight's video is already done; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  video:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      POST: ${{ github.event_name == 'schedule' || inputs.post || contains(github.event.head_commit.message, 'post-now') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Reuse downloaded voice and picture models from earlier runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('config.json') }}
          restore-keys: hf-models-

      - name: Install ffmpeg and Python packages
        run: |
          set -o pipefail
          mkdir -p out
          { sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
            sudo apt-get install -y -qq fonts-comic-neue > /dev/null || echo "Comic Neue font not available; using a fallback font"
            pip install -q -r requirements.txt
            # Local voice + picture generators (used when the free online services run out)
            sudo apt-get install -y -qq espeak-ng > /dev/null || true
            { pip install -q torch --index-url https://download.pytorch.org/whl/cpu \
              && pip install -q -r requirements-local.txt \
              && echo "Local voice and picture generators ready"; } || echo "Local generators could not be installed"
            # Free comic lettering font (SIL Open Font License) for titles and sound effects
            curl -sSfL -o fonts/Bangers-Regular.ttf https://github.com/google/fonts/raw/main/ofl/bangers/Bangers-Regular.ttf \
              && echo "Bangers font ready" || echo "Bangers font download failed; using a fallback font"
            ffmpeg -version | head -1; } 2>&1 | tee out/install.log

      - name: Make the video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKENS }}
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -o pipefail
          mkdir -p out
          python -u make_video.py 2>&1 | grep --line-buffered -v "it/s\]\|s/it\]" | tee out/run.log

      - name: Attach the video to this run (download it from the run summary)
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/video.mp4
            out/meta.json
          retention-days: 7

      - name: Check out the GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Put the video on GitHub Pages (also gives you a link to watch it)
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SLUG=$(jq -r .slug out/meta.json)
          KEEP=$(jq -r '.keep_videos_online // 10' config.json)
          cd site
          mkdir -p videos
          cp ../out/video.mp4 "videos/$SLUG.mp4"
          ls videos/*.mp4 | sort -r | tail -n +$((KEEP + 1)) | xargs -r rm -f
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Replace the branch history each time so old videos don't pile up in the repo.
          git checkout -q --orphan fresh
          git add -A
          git commit -qm "Publish $SLUG"
          git push -qf origin fresh:gh-pages
          BASE=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || true)
          if [ -z "$BASE" ]; then
            OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
            BASE="https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/"
          fi
          URL="${BASE%/}/videos/$SLUG.mp4"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "$URL" > ../state/latest-video.txt
          echo "### Watch the video: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Send to TikTok through Buffer (test runs save a draft instead)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_DRAFT: ${{ env.POST != 'true' }}
          VIDEO_URL: ${{ steps.pages.outputs.url }}
        run: |
          set -o pipefail
          python post_buffer.py 2>&1 | tee -a out/run.log

      - name: Remember which cases were used (and save this run's log)
        if: always() && hashFiles('state/used.json') != ''
        run: |
          cat out/install.log out/run.log > state/last-run.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -qm "Update used cases"
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
